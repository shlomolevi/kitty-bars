<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boop the Paw 🐾</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #12151c;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    .bg-blur {
      position: fixed;
      inset: -20px;
      background: url('cat.jpg') center/cover no-repeat;
      filter: blur(25px) brightness(0.45);
      z-index: 0;
    }

    .cat-wrapper {
      position: relative;
      z-index: 1;
      height: min(86dvh, 720px);
      aspect-ratio: 3 / 4;
      max-width: 94vw;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.12);
      transform-origin: center bottom;
      transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .cat-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .cat-wrapper.boop {
      animation: catSquish 0.38s cubic-bezier(0.25, 1.5, 0.5, 1);
    }

    @keyframes catSquish {
      0%   { transform: scale(1, 1) rotate(0deg); }
      25%  { transform: scale(1.045, 0.955) rotate(-1.5deg); }
      55%  { transform: scale(0.98, 1.025) rotate(1deg); }
      80%  { transform: scale(1.01, 0.99) rotate(-0.4deg); }
      100% { transform: scale(1, 1) rotate(0deg); }
    }

    .paw-hitbox {
      position: absolute;
      left: 44%;
      top: 75%;
      width: 34%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      cursor: pointer;
      z-index: 5;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 70%);
      animation: pulseHint 2.2s infinite ease-in-out;
    }

    .paw-hitbox.interacted {
      animation: none;
      background: transparent;
    }

    @keyframes pulseHint {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.4; }
      50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .badge {
      background: rgba(20, 24, 34, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease;
    }

    .badge.pop {
      transform: scale(1.12);
    }

    .hint-text {
      position: absolute;
      bottom: 18px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 6;
      transition: opacity 0.4s ease;
    }

    .particles-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      font-size: 22px;
      will-change: transform, opacity;
      animation: flyOut var(--dur, 0.85s) cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes flyOut {
      0% {
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
        opacity: 1;
      }
      70% {
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--scale, 1.2)) rotate(var(--rot));
        opacity: 0;
      }
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(255, 230, 245, 0.85);
      box-shadow: 0 0 15px rgba(255, 182, 222, 0.6);
      transform: translate(-50%, -50%) scale(0.2);
      pointer-events: none;
      animation: rippleWave 0.55s ease-out forwards;
    }

    @keyframes rippleWave {
      to {
        transform: translate(-50%, -50%) scale(2.4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="bg-blur"></div>

  <div class="cat-wrapper" id="catCard">
    <div class="hud">
      <div class="badge" id="counterBadge">🐾 Boops: 0</div>
      <div class="badge" id="moodBadge">Purr?</div>
    </div>

    <img src="cat.jpg" alt="Snow leopard reaching out its paw" class="cat-img">

    <div class="paw-hitbox" id="pawZone" aria-label="Boop the paw"></div>

    <div class="hint-text" id="hintText">Tap the soft paw ✨</div>
  </div>

  <div class="particles-layer" id="particles"></div>

  <script>
    const pawZone = document.getElementById('pawZone');
    const catCard = document.getElementById('catCard');
    const particlesLayer = document.getElementById('particles');
    const counterBadge = document.getElementById('counterBadge');
    const moodBadge = document.getElementById('moodBadge');
    const hintText = document.getElementById('hintText');

    let count = 0;
    let audioCtx = null;

    const emojis = ['✨', '💖', '🐾', '🌸', '⭐', '💕', '❄️', '💫'];
    const cutePhrases = [
      'Meow!', 'Purr-meow~', 'High five!', 'Prrr ❤️', 'More!',
      'Meow-meow!', 'Paw!', 'Blep-meow', 'You\'re the best ✨'
    ];

    const milestones = {
      10: '10 boops! Purrr~',
      25: '25! Kitty is happy 💕',
      50: '50! Maximum purr!',
      100: '100 boops of love! 💖'
    };

    function playMeow() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;
      const pitchShift = 0.92 + Math.random() * 0.22;
      const duration = 0.34 + Math.random() * 0.08;

      const osc = audioCtx.createOscillator();
      const subOsc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(340 * pitchShift, now);
      osc.frequency.exponentialRampToValueAtTime(620 * pitchShift, now + duration * 0.35);
      osc.frequency.exponentialRampToValueAtTime(390 * pitchShift, now + duration);

      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(680 * pitchShift, now);
      subOsc.frequency.exponentialRampToValueAtTime(1240 * pitchShift, now + duration * 0.35);
      subOsc.frequency.exponentialRampToValueAtTime(780 * pitchShift, now + duration);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1400, now);
      filter.frequency.exponentialRampToValueAtTime(700, now + duration);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.28, now + duration * 0.25);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      const subGain = audioCtx.createGain();
      subGain.gain.setValueAtTime(0.08, now);

      osc.connect(filter);
      subOsc.connect(subGain);
      subGain.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      subOsc.start(now);
      osc.stop(now + duration + 0.02);
      subOsc.stop(now + duration + 0.02);
    }

    function spawnParticles(x, y) {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      ripple.style.width = '70px';
      ripple.style.height = '70px';
      particlesLayer.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

      const amount = 9;
      for (let i = 0; i < amount; i++) {
        const el = document.createElement('div');
        el.className = 'particle';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        const angle = (Math.PI * 2 * i) / amount + (Math.random() - 0.5) * 0.5;
        const distance = 65 + Math.random() * 95;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - 25;
        const rot = (Math.random() - 0.5) * 140;
        const scale = 0.8 + Math.random() * 0.7;
        const dur = 0.65 + Math.random() * 0.35;

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.setProperty('--dx', `${dx}px`);
        el.style.setProperty('--dy', `${dy}px`);
        el.style.setProperty('--rot', `${rot}deg`);
        el.style.setProperty('--scale', scale);
        el.style.setProperty('--dur', `${dur}s`);

        particlesLayer.appendChild(el);
        setTimeout(() => el.remove(), dur * 1000 + 50);
      }
    }

    function handleBoop(e) {
      e.preventDefault();

      const clientX = e.clientX ?? (e.touches && e.touches[0].clientX) ?? window.innerWidth / 2;
      const clientY = e.clientY ?? (e.touches && e.touches[0].clientY) ?? window.innerHeight * 0.7;

      if ('vibrate' in navigator) {
        navigator.vibrate([25, 35, 45]);
      }

      playMeow();

      catCard.classList.remove('boop');
      void catCard.offsetWidth;
      catCard.classList.add('boop');

      spawnParticles(clientX, clientY);

      count++;
      pawZone.classList.add('interacted');
      hintText.style.opacity = '0';

      counterBadge.textContent = `🐾 Boops: ${count}`;
      counterBadge.classList.remove('pop');
      void counterBadge.offsetWidth;
      counterBadge.classList.add('pop');

      if (milestones[count]) {
        moodBadge.textContent = milestones[count];
      } else {
        moodBadge.textContent = cutePhrases[Math.floor(Math.random() * cutePhrases.length)];
      }
    }

    pawZone.addEventListener('pointerdown', handleBoop);
  </script>
</body>
</html>
